  # VEN (Venezuela) is not curated in this config: the IBC equity index is
  # bolívar-denominated under hyperinflation, so its daily returns / realized
  # volatility are inflation-dominated, not market-driven; the series also carries
  # pure data artifacts (equity ÷1000 scale breaks 2021-03 & 2025-07, FX ÷10⁶
  # redenomination Oct-2021). The series is still audited from the clean data
  # (it passes the equity screen) and drops out at spillover estimation, where
  # some rolling windows have near-singular covariances. See the sample appendix.
