# Source of truth for all panel countries
# Each country entry consumed by: ingestion jobs, quality checks, panel construction
# KAOPEN (capital openness) is sourced from data/parquet/kaopen.parquet, not here:
#   annual values 2019-2023, matched by calendar year and forward-filled within
#   each country; the 2023 vintage carries into 2024-2025 (see src/features/build_panel.py)
# crypto_ban is NO LONGER stored here: it is time-varying and derived daily from
#   config/crypto_ban_episodes.csv via src/features/crypto_ban.py (date-range join).
#   A country with no episode row is legal throughout (crypto_ban = 0).
#
# Fields:
#   id:          ISO3 country code (joins kaopen.parquet on iso3 for KAOPEN/tier)
#   name:        Full country name
#   equity:
#     source:    yahoo | investing_csv | null (FX-only country)
#     ticker:    Yahoo Finance ticker (if source=yahoo)
#     filename:  CSV filename in data/raw/investing_csvs/ (if source=investing_csv)
#     currency:  Local currency ISO code
#   fx:
#     source:    yahoo | fred | investing_csv
#     ticker:    Yahoo Finance ticker (format: XXXUSD=X gives local/USD)
#     fred_series: FRED series ID (if source=fred or as fallback)
#     filename:  CSV filename (if source=investing_csv)
#
# Yahoo FX ticker convention: XXXUSD=X → local currency per 1 USD
# e.g., JPYUSD=X → JPY per USD (higher = weaker JPY)

# ── TIER 1: OPEN (ka_open = 1.00) ──────────────────────────────────────────
countries:
