# ── GLOBAL CONTROL VARIABLES ────────────────────────────────────────────────
controls:
  - id: VIX
    name: "CBOE Volatility Index"
    source: yahoo
    ticker: "^VIX"
    role: global_risk_appetite

  - id: SP500
    name: "S&P 500"
    source: yahoo
    ticker: "^GSPC"
    role: global_equity

  - id: BRENT
    name: "Brent Crude Oil"
    source: yahoo
    ticker: "BZ=F"
    role: commodity_risk

  - id: DXY
    name: "US Dollar Index (Broad)"
    source: fred
    fred_series: "DTWEXBGS"
    role: usd_strength

