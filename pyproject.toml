[project]
name = "pfe"
version = "0.1.0"
description = "Capital-Account Openness and Cryptocurrency Volatility Spillovers to Domestic Equity and Foreign-Exchange Markets"
requires-python = ">=3.11"
dependencies = [
    # Data pipeline
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=14.0",
    "pandas>=2.0",
    # Data sources
    "requests>=2.31",
    "yfinance>=0.2.40",
    "fredapi>=0.5.1",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",         # Chinn-Ito kaopen workbook (legacy .xls format)
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Econometrics
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "linearmodels>=5.4",
    "pandera>=0.31.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
